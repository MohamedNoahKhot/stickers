<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a class="logo" href="#">MyWebsite</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="tag">WELCOME TO MY CORNER OF THE WEB</p>
      <h1>Hello, world! 👋</h1>
      <p class="intro">
        I'm learning web development and building my first website.
      </p>
      <button id="helloButton">Click me!</button>
      <p id="message" aria-live="polite"></p>
    </section>

    <section id="about" class="about">
      <h2>About Me</h2>
      <p>This is my first website, built with HTML, CSS and JavaScript.</p>
    </section>

    <section id="contact" class="about">
      <h2>Get in touch</h2>
      <p>Thanks for visiting my website!</p>
    </section>
  </main>

  <footer>
    <p>© 2026 MyWebsite. Built with ❤️</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
